name: Disparo Unico UTMify (23:50)

on:
  schedule:
    # 02:50 em UTC = 23:50 no horário de Brasília (SP)
    - cron: '50 2 * * *'
  workflow_dispatch:

jobs:
  run-utmify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python utmify.py
