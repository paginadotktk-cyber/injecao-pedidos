name: Execucao Agendada

on:
  schedule:
    # 10:00 UTC (07:00 BRT), 17:00 UTC (14:00 BRT), 02:00 UTC (23:00 BRT)
    - cron: '0 10,17,2 * * *'
  workflow_dispatch:

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Requests
        run: pip install requests

      - name: Rodar Injetor
        run: python injetor_pedidos.py
